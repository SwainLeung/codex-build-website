name: Harness CI

"on":
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-verify:
    name: harness-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Check harness layout
        run: python scripts/harness.py doctor
      # 接入项目时，在此复用项目的 Node、Go、Java 等运行时和锁定版本。
      # 安装依赖可写入 harness.config.json 的 setup 阶段。
      - name: Run application checks
        run: python scripts/harness.py check
